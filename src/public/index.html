<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Library</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">
    <div class="logo-icon">&#128218;</div>
    <h1 id="library-name">Little Library</h1>
  </a>
  <a class="header-link" href="/missing">Books to look for</a>
</header>

<main id="shell">
  <div id="grid-view">
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="stat-books">&mdash;</div><div class="stat-label">Books</div></div>
      <div class="stat"><div class="stat-num" id="stat-authors">&mdash;</div><div class="stat-label">Authors</div></div>
      <div class="stat"><div class="stat-num" id="stat-genres">&mdash;</div><div class="stat-label">Genres</div></div>
      <div class="stat"><div class="stat-num" id="stat-series">&mdash;</div><div class="stat-label">Series</div></div>
      <div class="stat"><div class="stat-num" id="stat-shown">&mdash;</div><div class="stat-label">Showing</div></div>
    </div>

    <div class="filters">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search title or author" autocomplete="off">
      </div>
      <select id="f-genre" aria-label="Filter by genre">
        <option value="">All genres</option>
      </select>
      <select id="f-series" aria-label="Filter by series">
        <option value="">Series &amp; standalone</option>
        <option value="in">In a series</option>
        <option value="order">Must be read in order</option>
        <option value="nofirst">Missing book 1</option>
        <option value="standalone">Standalone only</option>
      </select>
      <input id="f-age" type="number" min="0" max="18" placeholder="Age" aria-label="Filter by reader age">
      <button id="clear-filters" class="btn btn-quiet" type="button" hidden>Clear</button>
      <select id="sort" aria-label="Sort books">
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="added">Recently added</option>
        <option value="genre">Genre</option>
      </select>
      <select id="page-size" aria-label="Books per page">
        <option value="10">10 per page</option>
        <option value="20">20 per page</option>
        <option value="50">50 per page</option>
        <option value="100">100 per page</option>
        <option value="all">Show all</option>
        <option value="custom">Custom…</option>
      </select>
      <input id="page-size-custom" type="number" min="1" max="1000" hidden
             aria-label="Books per page" placeholder="e.g. 30">
    </div>

    <div class="results-meta" id="results-meta"></div>
    <div class="grid" id="grid"></div>
    <nav class="pager" id="pager" hidden></nav>
  </div>

  <div id="detail-view" hidden></div>
</main>

<script src="/app.js" type="module"></script>
</body>
</html>
